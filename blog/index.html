<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog von Hands of Hope – Geschichten aus unserer Arbeit, Einblicke in Rehabilitation, Straßencafé und Prävention, und Berichte aus unserem Alltag.">
  <title>Blog – Hands of Hope</title>

  <!-- <link rel="icon" href="../assets/favicons/favicon.ico"> -->

  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/navigation.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/typography.css">
  <link rel="stylesheet" href="../styles/sections.css">
  <link rel="stylesheet" href="../styles/forms.css">
  <link rel="stylesheet" href="../styles/gallery.css">
  <link rel="stylesheet" href="../styles/responsive.css">

  <script src="../scripts/includes.js" defer></script>
  <script src="../scripts/navigation.js" defer></script>
  <script src="../scripts/animations.js" defer></script>
  <script src="../scripts/lazyload.js" defer></script>

  <style>
    /* ── REVEAL ── */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .reveal.revealed { opacity: 1; transform: none; }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }

    /* ── HERO ── */
    .btn-blog-ghost {
      border: 1px solid rgba(255,255,255,0.35); color: var(--white);
      font-family: var(--font-head); font-weight: 700; font-size: 15px;
      padding: 14px 28px; border-radius: 8px; text-decoration: none;
      transition: background 0.2s; display: inline-block;
    }
    .btn-blog-ghost:hover { background: rgba(255,255,255,0.08); }

    /* ── SECTION LABELS ── */

    /* ── FEATURED POST ── */
    .featured-section {
      background: var(--white);
      padding: var(--section-pad-v) var(--section-pad-h);
    }
    .featured-inner {
      max-width: var(--max-width); margin: 0 auto;
    }
    .featured-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-deep);
      background: var(--brand-flaeche);
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .featured-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 70px rgba(5,41,55,0.22);
    }
    .featured-photo {
      position: relative;
      overflow: hidden;
      min-height: 420px;
    }
    .featured-photo img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      display: block;
      transition: transform 0.45s ease;
    }
    .featured-card:hover .featured-photo img { transform: scale(1.04); }
    .featured-photo-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to right, rgba(5,41,55,0.18) 0%, rgba(5,41,55,0.02) 100%);
    }
    .featured-content {
      padding: 3.5rem 3rem;
      display: flex; flex-direction: column; justify-content: center;
    }
    .featured-meta {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .featured-date {
      font-size: 13px; color: var(--auf-brand-leise);
    }
    .featured-content h2 {
      font-family: var(--font-head); font-weight: 800;
      font-size: clamp(1.5rem, 2.5vw, 2rem); line-height: 1.2;
      color: var(--white); margin-bottom: 1.25rem;
    }
    .featured-content p {
      font-size: 1rem; color: rgba(255,255,255,0.7);
      line-height: 1.75; margin-bottom: 2rem; max-width: 440px;
    }
    .featured-author {
      display: flex; align-items: center; gap: 0.85rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .featured-author-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 2px solid var(--brand-hell);
      /* Das maskierte Icon malt mit currentColor – ohne diese Zeile erbt es
         die dunkle Fließtextfarbe und verschwindet auf der Markenfläche. */
      color: var(--brand-hell);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .featured-author-name {
      font-family: var(--font-head); font-weight: 700;
      font-size: 14px; color: var(--white);
    }
    .featured-author-role {
      font-size: 12px; color: rgba(255,255,255,0.5);
    }
    .read-more {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--font-head); font-weight: 800; font-size: 14px;
      color: var(--blog-mid);
      transition: gap 0.2s;
    }
    .featured-card:hover .read-more { gap: 0.85rem; }

    /* ── POSTS GRID ── */
    .posts-section {
      background: var(--light-bg);
      padding: var(--section-pad-v) var(--section-pad-h);
    }
    .posts-inner { max-width: var(--max-width); margin: 0 auto; }
    .posts-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 3rem; gap: 2rem; flex-wrap: wrap;
    }
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
    }
    .post-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      text-decoration: none; color: inherit;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex; flex-direction: column;
    }
    .post-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }
    .post-photo {
      position: relative; overflow: hidden;
      aspect-ratio: 16/9;
    }
    .post-photo img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center; display: block;
      transition: transform 0.45s ease;
    }
    .post-card:hover .post-photo img { transform: scale(1.05); }
    .post-category-badge {
      position: absolute; top: 1rem; left: 1rem; z-index: 1;
      font-family: var(--font-head); font-weight: 800;
      font-size: 11px;
      padding: 5px 11px; border-radius: var(--radius-pill);
      backdrop-filter: blur(8px);
    }
    .badge-rehab    { background: var(--blau); color: #fff; }
    .badge-cafe     { background: var(--rot); color: #fff; }
    .badge-prev     { background: var(--blau); color: #fff; }
    .badge-dienst   { background: var(--gruen-tief); color: #fff; }
    .badge-allg     { background: rgba(5,41,55,0.75);    color: rgba(255,255,255,0.9); }
    .post-body {
      padding: 1.75rem;
      flex: 1; display: flex; flex-direction: column;
    }
    .post-meta {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 0.9rem; font-size: 12px; color: var(--text-light);
    }
    .post-meta-dot { opacity: 0.4; }
    .post-card h3 {
      font-family: var(--font-head); font-weight: 800;
      font-size: 1.15rem; line-height: 1.3;
      color: var(--dark); margin-bottom: 0.75rem;
    }
    .post-card p {
      font-size: 0.92rem; color: var(--text-light);
      line-height: 1.7; margin-bottom: 1.5rem; flex: 1;
    }
    .post-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 1rem;
      border-top: 1px solid var(--light-bg);
    }
    .post-author {
      display: flex; align-items: center; gap: 0.6rem;
    }
    .post-author-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--brand-zart); border: 1.5px solid var(--brand-hell);
      color: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
    }
    .post-author-name {
      font-family: var(--font-head); font-weight: 700;
      font-size: 13px; color: var(--dark);
    }
    .post-read-more {
      font-family: var(--font-head); font-weight: 800; font-size: 13px;
      color: var(--blog); display: inline-flex; align-items: center; gap: 0.35rem;
      transition: gap 0.2s;
    }
    .post-card:hover .post-read-more { gap: 0.6rem; }

    /* ── KATEGORIE-FILTER ── */
    .blog-filter { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .blog-filter-btn {
      font-family: var(--font-head); font-weight: 700; font-size: 13px;
      padding: 8px 16px; border-radius: 20px;
      border: 1px solid rgba(5,41,55,0.15); background: var(--white);
      color: var(--text-light); cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .blog-filter-btn:hover { border-color: var(--blog); color: var(--blog); }
    .blog-filter-btn.active { background: var(--blog); border-color: var(--blog); color: var(--white); }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .featured-card { grid-template-columns: 1fr; }
      .featured-photo { min-height: 260px; }
      .posts-grid { grid-template-columns: 1fr; }
      .posts-header { flex-direction: column; align-items: flex-start; }

    }
    @media (max-width: 600px) {
    }
  </style>
</head>
<body data-brand="dachmarke">

  <div data-include="header"></div>
  <div class="nav-spacer"></div>

  <main id="main-content">

    <!-- HERO -->
    <section class="hero" aria-label="Blog">
      <div class="hero-content">
        <span class="hero-tag">Geschichten von Menschen</span>
        <h1>Aus dem Herz unserer <em>Arbeit</em></h1>
        <p class="hero-sub">Echte Geschichten von echten Menschen. Hier berichten wir von Begegnungen, Veränderungen und dem, was uns täglich antreibt.</p>
        <div class="hero-actions">
          <a href="#beitraege" class="btn btn-primary">Alle Beiträge</a>
        </div>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div class="hero-photo-wrap">
          <img
              src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1200&q=80"
            alt="Menschen in Gemeinschaft"
            loading="eager"
          >
        </div>
      </div>
    </section>


    <!-- FEATURED POST -->
    <section class="featured-section" aria-label="Aktueller Beitrag">
      <div class="featured-inner">
        <div data-blog-featured></div>
      </div>
    </section>


    <!-- POSTS GRID -->
    <section class="posts-section" id="beitraege" aria-label="Weitere Beiträge">
      <div class="posts-inner">

        <div class="posts-header">
          <div>
            <span class="section-label reveal">Weitere Beiträge</span>
            <h2 class="section-title reveal">Aus allen Bereichen</h2>
          </div>
          <div class="blog-filter" data-blog-filter role="group" aria-label="Nach Kategorie filtern"></div>
        </div>

        <div class="posts-grid" data-blog-grid></div>

      </div>
    </section>



  </main>

  <div data-include="footer"></div>

<script src="posts.js" defer></script>
<script src="../scripts/cookie-banner.js"></script>
</body>
</html>
